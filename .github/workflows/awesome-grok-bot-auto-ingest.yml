name: Auto-ingest awesome-grok-bot Field Cases

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"
  push:
    branches: [main]
    paths:
      - "scripts/sync-awesome-grok-bot.mjs"
      - "scripts/ingest-awesome-grok-bot.ts"
      - ".github/workflows/awesome-grok-bot-auto-ingest.yml"

permissions:
  contents: write

concurrency:
  group: awesome-grok-bot-auto-ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sync Field Cases source feed
        run: node scripts/sync-awesome-grok-bot.mjs

      - name: Auto-ingest X candidates
        run: npx tsx scripts/ingest-awesome-grok-bot.ts
        env:
          SOURCE_INGEST_LIMIT: "10"
          SOURCE_INGEST_MAX_ATTEMPTS: "3"

      - name: Refresh source status after ingest
        run: node scripts/sync-awesome-grok-bot.mjs

      - name: Validate Discover data before publishing
        run: npm run validate:discover

      - name: Commit source feed and ingested stories directly
        shell: bash
        run: |
          git config user.name "usegrokbot-source-bot"
          git config user.email "usegrokbot-source-bot@users.noreply.github.com"
          git add data/source-feeds/awesome-grok-bot-field-cases.json data/discover/ingested.json

          if git diff --cached --quiet; then
            echo "No source or Discover changes to publish."
            exit 0
          fi

          git commit -m "chore: ingest awesome-grok-bot Field Cases"
          git push origin HEAD:main
