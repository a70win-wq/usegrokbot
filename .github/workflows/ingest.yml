name: Ingest use case

on:
  issues:
    types: [opened]
  workflow_dispatch:
    inputs:
      url:
        description: Public X post URL
        required: true

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  ingest:
    if: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.event.issue.title, 'Ingest use case:') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx tsx scripts/ingest-issue.ts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          INGEST_URL: ${{ github.event.inputs.url }}
      - if: ${{ failure() && github.event.issue.number }}
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              labels: ['error-queue'],
            });
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: 'Ingest failed. This issue is in the error queue.',
            });
      - if: ${{ success() && github.event.issue.number }}
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: 'closed',
              state_reason: 'completed',
            });
