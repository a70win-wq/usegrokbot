name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run validate:url-phase1
      - run: npm run validate:url-phase2
      - run: npm run validate:template-identities
      - run: npm run validate:template-types
      - run: npx tsx scripts/validate-discover.ts
      - run: npx tsx scripts/validate-search.ts
      - run: npx tsx scripts/validate-prompts.ts
